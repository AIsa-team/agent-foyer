name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Core end-to-end test (with container apps)
        run: |
          DATA_DIR=$(mktemp -d) HUB_SECRET=ci DEV_LOGIN=1 PORT=8080 node server/index.ts > hub.log 2>&1 &
          for i in $(seq 30); do curl -sf localhost:8080/healthz && break; sleep 1; done
          node scripts/smoke.ts http://localhost:8080 --docker
      - if: failure()
        run: cat hub.log || true
