# nginx in front of the hub. Replace hub.example.com / example.net with your own names.
# The hub lives at hub.example.com and apps at <slug>.example.net (a separate registrable domain is safest,
# see SECURITY.md). Apps need a wildcard certificate, e.g. certbot with a DNS plugin:
#   certbot certonly --dns-cloudflare --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini \
#     -d hub.example.com -d example.net -d '*.example.net'
# Needs the $connection_upgrade map, e.g. in conf.d/connection-upgrade.conf:
#   map $http_upgrade $connection_upgrade { default upgrade; '' close; }

upstream agent_hub {
    server 127.0.0.1:8090;   # HUB_PORT
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name hub.example.com *.example.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hub.example.com *.example.net;

    ssl_certificate     /etc/letsencrypt/live/example.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100m;
    proxy_request_buffering off;   # stream uploads straight to the hub
    proxy_read_timeout 300s;       # container builds can take a while

    location / {
        proxy_pass http://agent_hub;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
